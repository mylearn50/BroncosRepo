<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Broncos Finance Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https Inc.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0F0F0F; color: white; margin: 0; }
        .bg-broncos-orange { background-color: #FF5E00; }
        .bg-broncos-card { background-color: #1E1E1E; }
        .text-broncos-orange { color: #FF5E00; }
        /* Mobile Zoom Fix: Ensure font-size is at least 16px */
        input, select { font-size: 16px !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const SECRET = "broncos2024";
        const CATS = ["Ground Fee", "Jersey", "Equipment", "Travel", "Food", "League Fee", "Other"];
        const PURP = ["League Fee", "Past Dues", "Equipment", "Misc"];

        function App() {
            const [auth, setAuth] = useState(false);
            const [pass, setPass] = useState("");
            const [tab, setTab] = useState('dash');
            const [data, setData] = useState(() => {
                const s = localStorage.getItem('broncos_pro_v11');
                return s ? JSON.parse(s) : { players: [], leagues: [], registrations: [], payments: [], expenses: [] };
            });

            useEffect(() => { localStorage.setItem('broncos_pro_v11', JSON.stringify(data)); }, [data]);

            // --- CORE ENGINE: UPPERCASE ENFORCEMENT ---
            const handleInputChange = (e, field, collection, id = null) => {
                const val = e.target.value.toUpperCase();
                if (id === null) {
                    // Adding new item
                    const newItem = { ...e.target.elements }; // simplified for demo
                    // In a real app, we'd map specific fields
                }
            };

            // --- ACTIONS ---
            const addPlayer = (name, role) => add('players', { name: name.toUpperCase(), role });
            const addLeague = (name, budget) => add('leagues', { name: name.toUpperCase(), budget: Number(budget) });
            
            const registerPlayer = (playerId, leagueId) => {
                const player = data.players.find(p => p.id === playerId);
                const league = data.leagues.find(l => l.id === leagueId);
                if(!player || !league) return;
                
                const existing = data.registrations.find(r => r.playerId === playerId && r.leagueId === leagueId);
                if(existing) return alert("Already registered");

                add('registrations', { 
                    playerId, 
                    leagueId, 
                    status: 'UNPAID', 
                    balance: league.budget 
                });
            };

            const add = (type, obj) => setData({ ...data, [type]: [...data[type], { id: Date.now(), ...obj }] });
            const del = (type, id) => { if(confirm("Delete?")) setData({ ...data, [type]: data[type].filter(i => i.id !== id) }); };

            // Payment logic that updates the Registration balance
            const recordPayment = (regId, amount, date, purpose) => {
                const amt = Number(amount);
                const newPayments = [...data.payments, { id: Date.now(), regId: Number(regId), amount: amt, date, purpose }];
                
                const newRegs = data.registrations.map(r => {
                    if(r.id === Number(regId)) {
                        const newBal = r.balance - amt;
                        return { ...r, balance: newBal, status: newBal <= 0 ? 'PAID' : 'PARTIAL' };
                    }
                    return r;
                });

                setData({ ...data, payments: newPayments, registrations: newRegs });
            };

            const addExpense = (type, leagueId, amount, date, category, pb) => {
                add('expenses', { type, leagueId: leagueId ? Number(leagueId) : null, amount: Number(amount), date, category, paidBy: pb });
            };

            // --- ANALYTICS ---
            const stats = useMemo(() => {
                const inc = data.payments.reduce((s, i) => s + i.amount, 0);
                const exp = data.expenses.reduce((s, i) => s + i.amount, 0);
                return { inc, exp, bal: inc - exp };
            }, [data]);

            if (!auth) return (
                <div className="h-screen flex items-center justify-center p-6 bg-black">
                    <form onSubmit={(e) => {e.preventDefault(); if(pass === SECRET) setAuth(true); else alert("Wrong Code");}} className="w-full max-w-sm bg-broncos-card p-8 rounded-3xl border border-gray-800 text-center">
                        <div className="w-16 h-16 bg-broncos-orange rounded-xl mx-auto mb-4 flex items-center justify-center text-black text-3xl font-black italic">B</div>
                        <h1 className="text-xl font-black italic mb-6 uppercase">Broncos Access</h1>
                        <input type="password" placeholder="Code" className="w-full p-4 bg-black border border-gray-700 rounded-xl mb-4 text-center outline-none focus:border-broncos-orange" onChange={e => setPass(e.target.value)} />
                        <button className="w-full bg-broncos-orange text-black font-black p-4 rounded-xl uppercase">Unlock</button>
                    </form>
                </div>
            );

            return (
                <div className="min-h-screen pb-24">
                    <header className="p-4 sticky top-0 z-50 bg-black/90 border-b border-gray-800 flex justify-between items-center">
                        <h1 className="font-black italic text-lg">BRONCOS <span className="text-broncos-orange">PRO</span></h1>
                        <button onClick={() => setAuth(false)} className="text-[10px] font-bold uppercase text-gray-500">Lock</button>
                    </header>

                    <main className="max-w-md mx-auto p-4">
                        {tab === 'dash' && (
                            <div className="space-y-6 animate-in fade-in">
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-broncos-card p-4 rounded-2xl border-b-4 border-green-500">
                                        <p className="text-[10px] font-bold text-gray-400 uppercase">Total In</p>
                                        <p className="text-2xl font-black text-green-500">${stats.inc}</p>
                                    </div>
                                    <div className="bg-broncos-card p-4 rounded-2xl border-b-4 border-red-500">
                                        <p className="text-[10px] font-bold text-gray-400 uppercase">Total Out</p>
                                        <p className="text-2xl font-black text-red-500">${stats.exp}</p>
                                    </div>
                                </div>
                                <div className="bg-broncos-orange p-6 rounded-3xl text-black shadow-xl">
                                    <p className="font-black uppercase text-xs opacity-70">Net Balance</p>
                                    <p className="text-5xl font-black">${stats.bal}</p>
                                </div>
                            </div>
                        )}

                        {tab === 'team' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-black italic text-broncos-orange">Players</h2>
                                <form onSubmit={(e) => {e.preventDefault(); addPlayer(e.target.n.value, e.target.r.value); e.target.reset();}} className="bg-broncos-card p-4 rounded-2xl space-y-3 border-t-4 border-broncos-orange">
                                    <input name="n" placeholder="Name" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required />
                                    <select name="r" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm">
                                        <option>Player</option><option>Captain</option><option>Manager</option>
                                    </select>
                                    <button className="w-full bg-broncos-orange text-black font-black p-3 rounded-xl uppercase text-sm">Add Member</button>
                                </form>
                                <div className="space-y-2">
                                    {data.players.map(p => <div key={p.id} className="bg-broncos-card p-4 rounded-2xl flex justify-between items-center">
                                        <div><p className="font-bold text-white">{p.name}</p><p className="text-xs text-gray-500 uppercase">{p.role}</p></div>
                                        <button onClick={() => del('players', p.id)} className="text-red-500">✕</button>
                                    </div>)}
                                </div>
                            </div>
                        )}

                        {tab === 'league' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-black italic text-broncos-orange">Leagues</h2>
                                <form onSubmit={(e) => {e.preventDefault(); addLeague(e.target.n.value, e.target.b.value); e.target.reset();}} className="bg-broncos-card p-4 rounded-2xl space-y-3 border-t-4 border-broncos-orange">
                                    <input name="n" placeholder="League Name" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required />
                                    <input name="b" type="number" placeholder="Budget ($)" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required />
                                    <button className="w-full bg-broncos-orange text-black font-black p-3 rounded-xl uppercase text-sm">Add League</button>
                                </form>
                                <div className="space-y-2">
                                    {data.leagues.map(l => <div key={l.id} className="bg-broncos-card p-4 rounded-2xl flex justify-between items-center">
                                        <div><p className="font-bold">{l.name}</p><p className="text-xs text-gray-500">Budget: ${l.budget}</p></div>
                                        <button onClick={() => del('leagues', l.id)} className="text-red-500">✕</button>
                                    </div>)}
                                </div>
                            </div>
                        )}

                        {tab === 'in' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-black italic text-green-500">Payments</h2>
                                <form onSubmit={(e) => {e.preventDefault(); const f=e.target; recordPayment(f.reg.value, f.a.value, f.d.value, f.purp.value); f.reset();}} className="bg-broncos-card p-4 rounded-2xl space-y-3 border-t-4 border-green-500">
                                    <select name="reg" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required>
                                        <option value="">Select Registration</option>
                                        {data.registrations.map(r => {
                                            const p = data.players.find(pl => pl.id === r.playerId);
                                            const l = data.leagues.find(le => le.id === r.leagueId);
                                            return <option key={r.id} value={r.id}>{p?.name} ({l?.name})</option>
                                        })}
                                    </select>
                                    <input name="a" type="number" placeholder="Amount ($)" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required />
                                    <input name="d" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required />
                                    <select name="purp" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm">
                                        {PURP.map(p => <option key={p} value={p}>{p}</option>)}
                                    </select>
                                    <button className="w-full bg-green-600 text-white font-black p-3 rounded-xl uppercase text-sm">Confirm Payment</button>
                                </form>
                                <div className="space-y-2">
                                    {data.payments.slice().reverse().map(p => (
                                        <div key={p.id} className="bg-broncos-card p-4 rounded-2xl flex justify-between items-center text-sm">
                                            <div><p className="font-bold text-white">Payment Received</p><p className="text-[10px] text-gray-500 uppercase">{p.purpose} • {p.date}</p></div>
                                            <p className="font-black text-green-500">+${p.amount}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === 'out' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-black italic text-red-500">Expenses</h2>
                                <form onSubmit={(e) => {e.preventDefault(); const f=e.target; add('expenses', {type: f.t.value, leagueId: f.l.value ? Number(f.l.value) : null, amount: Number(f.a.value), date: f.d.value, category: f.c.value, paidBy: f.pb.value}); f.reset();}} className="bg-broncos-card p-4 rounded-2xl space-y-3 border-t-4 border-red-500">
                                    <input name="t" placeholder="Description" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required />
                                    <select name="c" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm">
                                        {CATS.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                    <select name="l" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm">
                                        <option value="">General Fund</option>{data.leagues.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                                    </select>
                                    <input name="a" type="number" placeholder="Amount ($)" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required />
                                    <input name="d" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required />
                                    <select name="pb" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm">
                                        <option>Team Fund</option><option>Individual</option>
                                    </select>
                                    <button className="w-full bg-red-600 text-white font-black p-3 rounded-xl uppercase text-sm">Record Cost</button>
                                </form>
                                <div className="space-y-2">
                                    {data.expenses.slice().reverse().map(e => (
                                        <div key={e.id} className="bg-broncos-card p-4 rounded-2xl flex justify-between items-center text-sm border-l-4 border-red-500">
                                            <div><p className="font-bold text-white">{e.type}</p><p className="text-[10px] text-gray-500 uppercase">{e.category} • {e.date}</p></div>
                                            <p className="font-black text-red-500">-${e.amount}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === 'reg' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-black italic text-broncos-orange">Register Player</h2>
                                <form onSubmit={(e) => {e.preventDefault(); const f=e.target; add('registrations', {playerId: Number(f.p.value), leagueId: Number(f.l.value), status: 'UNPAID', balance: data.leagues.find(l=>l.id===Number(f.l.value))?.budget || 0}); f.reset();}} className="bg-broncos-card p-4 rounded-2xl space-y-3 border-t-4 border-broncos-orange">
                                    <select name="p" className="w-full p-3 bg-black border
