<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Broncos Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0F0F0F; color: white; margin: 0; }
        .bg-broncos-orange { background-color: #FF5E00; }
        .bg-broncos-card { background-color: #1E1E1E; }
        .text-broncos-orange { color: #FF5E00; }
        input, select { font-size: 16px !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const SECRET = "broncos2024";
        const CATS = ["Ground Fee", "Jersey", "Equipment", "Travel", "Food", "League Fee", "Other"];
        const PURP = ["League Fee", "Past Dues", "Equipment", "Misc"];

        function App() {
            const [auth, setAuth] = useState(false);
            const [pass, setPass] = useState("");
            const [tab, setTab] = useState('dash');
            const [data, setData] = useState(() => {
                const s = localStorage.getItem('broncos_final_v13');
                return s ? JSON.parse(s) : { players: [], leagues: [], registrations: [], transactions: [] };
            });

            useEffect(() => { localStorage.setItem('broncos_final_v13', JSON.stringify(data)); }, [data]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (pass === SECRET) setAuth(true); else alert("Wrong Code");
            };

            const add = (type, obj) => setData({ ...data, [type]: [...data[type], { id: Date.now(), ...obj }] });
            const del = (type, id) => { if(confirm("Delete?")) setData({ ...data, [type]: data[type].filter(i => i.id !== id) }); };

            const regPlayer = (pId, lId) => {
                if (data.registrations.find(r => r.playerId === Number(pId) && r.leagueId === Number(lId))) return alert("Already Registered!");
                const league = data.leagues.find(l => l.id === Number(lId));
                add('registrations', { playerId: Number(pId), leagueId: Number(lId), balance: league.budget, status: 'UNPAID' });
            };

            const recordTrans = (regId, amount, date, type, cat) => {
                const amt = Number(amount);
                const newT = { id: Date.now(), regId: Number(regId), amount: amt, date, type, category: cat };
                const newR = data.registrations.map(r => {
                    if (r.id === Number(regId)) {
                        const newBal = type === 'IN' ? r.balance - amt : r.balance + amt;
                        let status = 'UNPAID';
                        if (newBal <= 0) status = 'PAID';
                        else if (newBal < 50) status = 'PARTIAL';
                        return { ...r, balance: newBal, status };
                    }
                    return r;
                });
                setData({ ...data, transactions: [...data.transactions, newT], registrations: newR });
            };

            const exportDB = () => {
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'broncos_backup.json'; a.click();
            };

            const importDB = (e) => {
                const reader = new FileReader();
                reader.onload = (evt) => { try { setData(JSON.parse(evt.target.result)); alert("Sync Success!"); } catch(err) { alert("Error"); } };
                reader.readAsText(e.target.files[0]);
            };

            const stats = useMemo(() => {
                const inc = data.transactions.filter(t => t.type === 'IN').reduce((s, i) => s + i.amount, 0);
                const exp = data.transactions.filter(t => t.type === 'OUT').reduce((s, i) => s + i.amount, 0);
                return { inc, exp, bal: inc - exp };
            }, [data]);

            if (!auth) return (
                <div className="h-screen flex items-center justify-center p-6 bg-black">
                    <form onSubmit={handleLogin} className="w-full max-w-sm bg-broncos-card p-8 rounded-3xl border border-gray-800 text-center">
                        <div className="w-16 h-16 bg-broncos-orange rounded-xl mx-auto mb-4 flex items-center justify-center text-black text-3xl font-black italic">B</div>
                        <h1 className="text-xl font-black italic mb-6 uppercase">Broncos Access</h1>
                        <input type="password" placeholder="Code" className="w-full p-4 bg-black border border-gray-700 rounded-xl mb-4 text-center outline-none" onChange={e => setPass(e.target.value)} />
                        <button className="w-full bg-broncos-orange text-black font-black p-4 rounded-xl uppercase">Unlock</button>
                    </form>
                </div>
            );

            return (
                <div className="min-h-screen pb-24">
                    <header className="p-4 sticky top-0 z-50 bg-black/90 border-b border-gray-800 flex justify-between items-center">
                        <h1 className="font-black italic text-lg">BRONCOS <span className="text-broncos-orange">PRO</span></h1>
                        <button onClick={() => setAuth(false)} className="text-[10px] font-bold uppercase text-gray-500">Lock</button>
                    </header>

                    <main className="max-w-md mx-auto p-4">
                        {tab === 'dash' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-broncos-card p-4 rounded-2xl border-l-4 border-green-500">
                                        <p className="text-[10px] font-bold text-gray-400 uppercase">Income</p>
                                        <p className="text-2xl font-black text-green-500">${stats.inc}</p>
                                    </div>
                                    <div className="bg-broncos-card p-4 rounded-2xl border-l-4 border-red-500">
                                        <p className="text-[10px] font-bold text-gray-400 uppercase">Spent</p>
                                        <p className="text-2xl font-black text-red-500">${stats.exp}</p>
                                    </div>
                                </div>
                                <div className="bg-broncos-orange p-6 rounded-3xl text-black shadow-xl">
                                    <p className="font-black uppercase text-xs opacity-70">Net Balance</p>
                                    <p className="text-5xl font-black">${stats.bal}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={exportDB} className="bg-gray-800 text-[10px] font-bold p-3 rounded-xl uppercase">Export Data</button>
                                    <label className="bg-gray-800 text-[10px] font-bold p-3 rounded-xl uppercase text-center cursor-pointer">
                                        Import <input type="file" className="hidden" onChange={importDB} />
                                    </label>
                                </div>
                            </div>
                        )}

                        {tab === 'team' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-black italic text-broncos-orange">Team Roster</h2>
                                <form onSubmit={(e) => {e.preventDefault(); add('players', {name: e.target.n.value.toUpperCase(), role: e.target.r.value}); e.target.reset();}} className="bg-broncos-card p-4 rounded-2xl space-y-3 border-t-4 border-broncos-orange">
                                    <input name="n" placeholder="Player Name" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required />
                                    <select name="r" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm">
                                        <option>Player</option><option>Captain</option><option>Manager</option>
                                    </select>
                                    <button className="w-full bg-broncos-orange text-black font-black p-3 rounded-xl uppercase text-sm">Add Member</button>
                                </form>
                                <div className="space-y-2">
                                    {data.players.map(p => <div key={p.id} className="bg-broncos-card p-4 rounded-2xl flex justify-between items-center">
                                        <div><p className="font-bold text-white">{p.name}</p><p className="text-xs text-gray-500 uppercase">{p.role}</p></div>
                                        <button onClick={() => del('players', p.id)} className="text-red-500">✕</button>
                                    </div>)}
                                </div>
                            </div>
                        )}

                        {tab === 'league' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-black italic text-broncos-orange">Leagues</h2>
                                <form onSubmit={(e) => {e.preventDefault(); add('leagues', {name: e.target.n.value.toUpperCase(), budget: e.target.b.value}); e.target.reset();}} className="bg-broncos-card p-4 rounded-2xl space-y-3 border-t-4 border-broncos-orange">
                                    <input name="n" placeholder="League Name" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required />
                                    <input name="b" type="number" placeholder="Budget ($)" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required />
                                    <button className="w-full bg-broncos-orange text-black font-black p-3 rounded-xl uppercase text-sm">Add League</button>
                                </form>
                                <div className="space-y-2">
                                    {data.leagues.map(l => <div key={l.id} className="bg-broncos-card p-4 rounded-2xl flex justify-between items-center">
                                        <div><p className="font-bold">{l.name}</p><p className="text-xs text-gray-500">Goal: ${l.budget}</p></div>
                                        <button onClick={() => del('leagues', l.id)} className="text-red-500">✕</button>
                                    </div>)}
                                </div>
                            </div>
                        )}

                        {tab === 'reg' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-black italic text-broncos-orange">Registrations</h2>
                                <form onSubmit={(e) => {e.preventDefault(); regPlayer(e.target.p.value, e.target.l.value); e.target.reset();}} className="bg-broncos-card p-4 rounded-2xl space-y-3 border-t-4 border-broncos-orange">
                                    <select name="p" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required>
                                        <option value="">Select Player</option>{data.players.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                    </select>
                                    <select name="l" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required>
                                        <option value="">Select League</option>{data.leagues.map(l => <option key={l.id} value={l.name}</option>)}
                                    </select>
                                    <button className="w-full bg-broncos-orange text-black font-black p-3 rounded-xl uppercase text-sm">Register</button>
                                </form>
                                <div className="space-y-2">
                                    {data.registrations.map(r => {
                                        const p = data.players.find(pl => pl.id === r.playerId);
                                        const l = data.leagues.find(le => le.id === r.leagueId);
                                        return (
                                            <div key={r.id} className="bg-broncos-card p-4 rounded-2xl flex justify-between items-center border-l-4 border-broncos-orange">
                                                <div><p className="font-bold text-white">{p?.name}</p><p className="text-xs text-gray-500 uppercase">{l?.name}</p></div>
                                                <div className="text-right">
                                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${r.status === 'PAID' ? 'bg-green-900 text-green-400' : 'bg-red-900 text-red-400'}`}>{r.status}</span>
                                                    <p className="text-sm font-black mt-1">${r.balance}</p>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {tab === 'fin' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-black italic text-orange-500">Ledger</h2>
                                <form onSubmit={(e) => {e.preventDefault(); const f=e.target; recordTrans(f.r.value, f.a.value, f.d.value, f.t.value, f.c.value); f.reset();}} className="bg-broncos-card p-4 rounded-2xl space-y-3 border-t-4 border-orange-500">
                                    <select name="r" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required>
                                        <option value="">Select Registration</option>
                                        {data.registrations.map(r => {
                                            const p = data.players.find(pl => pl.id === r.playerId);
                                            const l = data.leagues.find(le => le.id === r.leagueId);
                                            return <option key={r.id} value={r.id}>{p?.name} ({l?.name})</option>
                                        })}
                                    </select>
                                    <select name="t" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm">
                                        <option value="IN">Income (Payment)</option>
                                        <option value="OUT">Expense (Cost)</option>
                                    </select>
                                    <input name="a" type="number" placeholder="Amount ($)" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required />
                                    <input name="d" type="date" defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm" required />
                                    <select name="c" className="w-full p-3 bg-black border border-gray-700 rounded-xl text-sm">
                                        <option value="Misc">Misc</option>
                                        {data.transactions.filter(t=>t.type==='IN').length === 0 ? CATS.map(c => <option key={c} value={c}>{c}</option>) : PURP.map(p => <option key={p} value={p}</option>)}
                                    </select>
                                    <button className="w-full bg-orange-600 text-white font-black p-3 rounded-xl uppercase text-sm">Record</button>
                                </form>
                                <div className="space-y-2">
                                    {data.transactions.slice().reverse().map(t => (
                                        <div key={t.id} className={`p-3 rounded-xl flex justify-between items-center text-sm ${t.type === 'IN' ? 'bg-green-900/20' : 'bg-red-900/20'}`}>
                                            <div><p className="font-bold text-white">{t.category || t.type}</p><p className="text-[10px] text-gray-500 uppercase">{t.date}</p></div>
                                            <p className={`font-black ${t.type === 'IN' ? 'text-green-500' : 'text-red-500'}`}>${t.amount}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-black border-t border-gray-800 flex justify-around p-3 pb-6 z-50">
                        <NavBtn active={tab === 'dash'} label="Home" icon="🏠" onClick={() => setTab('dash')} />
                        <NavBtn active={tab === 'team'} label="Team" icon="👥" onClick={() => setTab('team')} />
                        <NavBtn active={tab === 'league'} label="Leagues" icon="🏆" onClick={() => setTab('league')} />
                        <NavBtn active={tab === 'reg'} label="Reg" icon="📝" onClick={() => setTab('reg')} />
                        <NavBtn active={tab === 'fin'} label="Money" icon="💰" onClick={() => setTab('fin')} />
                    </nav>
                </div>
            );
        }

        function NavBtn({ active, label, icon, onClick }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center transition-all ${active ? 'text-broncos-orange scale-110' : 'text-gray-500'}`}>
                    <span className="text-xl">{icon}</span>
                    <span className="text-[10px] font-bold uppercase tracking-tighter">{label}</span>
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
